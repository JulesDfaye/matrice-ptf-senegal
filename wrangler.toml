name = "matrice-ptf-senegal"
main = "api/index.js"
compatibility_date = "2026-10-30"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "matrice-ptf-senegal"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[observability]
enabled = true
